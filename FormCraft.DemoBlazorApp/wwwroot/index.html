<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormCraft - Dynamic Form Builder for Blazor</title>
    <base href="/" />
    
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) { 
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Vendor sheets first. Prism ships its light theme with the same specificity
         as our overrides, so it has to come before them or it wins every tie and the
         code blocks revert to black text on a cream ground. -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="lib/prism/prism.min.css" rel="stylesheet" />

    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/shell.css" rel="stylesheet" />
    <link href="css/home.css" rel="stylesheet" />
    <link href="css/demo.css" rel="stylesheet" />
    <link href="app.css" rel="stylesheet" />
    <link href="FormCraft.DemoBlazorApp.styles.css" rel="stylesheet" />
    <script type="importmap"></script>

    <script>
        // Resolve the theme before first paint so the loading screen and the app
        // agree, and a returning dark-mode visitor never gets a white flash.
        (function () {
            try {
                var stored = localStorage.getItem('formcraft-theme');
                var dark = stored === null
                    ? window.matchMedia('(prefers-color-scheme: dark)').matches
                    : stored === 'dark';
                if (dark) document.documentElement.classList.add('fc-boot-dark');
            } catch (e) { /* private mode: fall through to light */ }
        })();
    </script>

    <style>
        /* The loading screen is the first impression, so it is built from the
           same tokens as the app: ink ground, mono wordmark, one green tie. */
        #app-loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F5F4F8;
            z-index: 9999;
        }

        .fc-boot-dark #app-loading { background: #131120; }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .loading-text {
            font-family: 'Bricolage Grotesque', 'Helvetica Neue', sans-serif;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #16141F;
            line-height: 1;
        }

        .fc-boot-dark .loading-text { color: #E9E6F2; }

        /* The rule "draws" left to right: the binding being made. */
        .loading-rule {
            width: 220px;
            height: 2px;
            background: #E1DFEA;
            position: relative;
            overflow: hidden;
        }

        .fc-boot-dark .loading-rule { background: #2E2947; }

        .loading-rule::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #14A06B;
            transform-origin: left center;
            animation: drawRule 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .fc-boot-dark .loading-rule::after { background: #34D399; }

        @keyframes drawRule {
            0%   { transform: scaleX(0); }
            55%  { transform: scaleX(1); transform-origin: left center; }
            56%  { transform: scaleX(1); transform-origin: right center; }
            100% { transform: scaleX(0); transform-origin: right center; }
        }

        .loading-subtext {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #6A6580;
        }

        .fc-boot-dark .loading-subtext { color: #A29CBD; }

        @media (prefers-reduced-motion: reduce) {
            .loading-rule::after { animation: none; transform: scaleX(1); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div class="loading-content">
                <div class="loading-text">FormCraft</div>
                <div class="loading-rule"></div>
                <div class="loading-subtext">Binding C# to forms</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="lib/prism/prism.min.js"></script>
    <script src="lib/prism/prism-csharp.min.js"></script>
    <script src="lib/prism/prism-cshtml.min.js"></script>
    <script src="js/docs.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
