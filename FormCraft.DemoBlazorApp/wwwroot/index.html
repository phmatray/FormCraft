<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormCraft: forms in a few lines of C#</title>
    <meta name="description" content="FormCraft builds validated, accessible Blazor forms from a typed C# builder. MIT licensed, for MudBlazor and Fluent UI." />
    <meta name="theme-color" content="#0A0B16" />
    <base href="/" />

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // This script checks to see if a redirect is present in the query string,
        // converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function(l) {
            if (l.search[1] === '/' ) {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->

    <!-- The adapter picked in the top bar sets the accent (tokens.css). Applied before the
         stylesheets paint so a Fluent UI visitor never sees a violet first frame. A shared link's
         ?adapter= wins over the stored choice and becomes it; only 'fluentui' and 'mudblazor' are
         honoured, and storage may throw when site data is blocked. The attribute is what
         fcAdapter.get (js/app.js) reports to Blazor. -->
    <script>
        (function () {
            var a = null;
            try { a = new URLSearchParams(location.search).get('adapter'); } catch (e) { }
            if (a === 'fluentui' || a === 'mudblazor') {
                try { localStorage.setItem('fc-adapter', a); } catch (e) { }
            } else {
                try { a = localStorage.getItem('fc-adapter'); } catch (e) { }
            }
            if (a === 'fluentui') document.documentElement.dataset.adapter = 'fluentui';
        })();
    </script>

    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script type="importmap"></script>

    <style>
        /* The loading screen is the first impression: same ground, same face as the site. */
        #app-loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            background: #0A0B16;
            z-index: 9999;
        }

        .loading-content {
            display: grid;
            gap: 18px;
            justify-items: start;
        }

        .loading-text {
            font-family: 'Sora', 'Helvetica Neue', sans-serif;
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -0.045em;
            color: #EEF0FF;
            line-height: 1;
        }

        .loading-rule {
            width: 220px;
            height: 2px;
            background: #262A52;
            position: relative;
            overflow: hidden;
        }

        .loading-rule::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #FFD166;
            transform-origin: left center;
            animation: drawRule 1.1s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        }

        @keyframes drawRule {
            0%   { transform: scaleX(0); }
            55%  { transform: scaleX(1); transform-origin: left center; }
            56%  { transform: scaleX(1); transform-origin: right center; }
            100% { transform: scaleX(0); transform-origin: right center; }
        }

        .loading-subtext {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            color: #8D93BE;
        }

        @media (prefers-reduced-motion: reduce) {
            .loading-rule::after { animation: none; transform: scaleX(1); }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div class="loading-content">
                <div class="loading-text">FormCraft</div>
                <div class="loading-rule"></div>
                <div class="loading-subtext">Forms in a few lines of C#</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="js/code.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
