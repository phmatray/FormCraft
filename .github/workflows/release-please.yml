name: release-please

# Derives the next semantic version from the Conventional Commits on `dev` and keeps a release PR
# up to date (rewriting CHANGELOG.md + .release-please-manifest.json). Merging that PR tags vX.Y.Z
# and creates the GitHub Release.
#
# Two things differ from the other release-please repos in this portfolio (Koine, AdrMcp,
# x402-dotnet, blazor-tailwind-ui, ai-migration-kit), and both are deliberate:
#
#   1. The target branch is `dev`, not `main`. `dev` is FormCraft's default branch; `main` is a
#      release branch that this repo no longer merges into.
#   2. The version is written into NO file. FormCraft's version comes from MinVer, which reads the
#      git tag release-please creates — so the tag is the single source of truth. The other repos
#      have release-please rewrite a <Version> element in Directory.Build.props; here that element
#      would be inert, because MinVer's targets override any version passed in (see build/Build.cs).
#      This is why release-please-config.json has no `extra-files`; the reason is recorded there too.
#
# Publishing lives in the `nupkg` job of THIS workflow rather than in a tag-triggered workflow, and
# it has to: release-please creates the tag with GITHUB_TOKEN, and GitHub deliberately does not fire
# `on: push: tags` / `on: release` for events created by that token. A tag-triggered publish would
# therefore never run again — silently, with no failed run to notice.

on:
  push:
    branches: [dev]
  # Manual dry-run: `release_created` is false off a dispatch, so every publish step is skipped.
  # Use it to validate the release path without sending anything to nuget.org.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Serialize release-please runs. The action pushes a release-PR branch and, on merge, creates the
# tag and the GitHub Release; two overlapping runs could race on the tag/manifest. Never cancel an
# in-progress run — cancelling mid-tag can leave the tag/manifest half-applied.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Backstop so a wedged step can't run to the 6-hour default.
    timeout-minutes: 15
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packs and publishes both packages for the release the job above just tagged. Deliberately thin:
  # because it checks out the tag, Nuke's PublishIfNeeded gate — OnlyWhenStatic(IsOnVersionTag() &&
  # IsServerBuild) — is already satisfied, so `./build.cmd Continuous` publishes exactly as it did
  # from the old tag-triggered workflow and build/Build.cs needs no change at all.
  #
  # Safety properties this job depends on:
  #   - No publish path may ever run on `pull_request`. This workflow has no pull_request trigger,
  #     and a fork could not obtain this repository's OIDC token anyway — minting a key on a PR
  #     would be both pointless and a hard failure.
  #   - `release_created` is false on a workflow_dispatch, which is what makes the dry-run safe:
  #     every publish step below is gated on it, so a dispatch exercises the build/pack path and
  #     sends nothing to nuget.org.
  #   - Publishing requires a nuget.org Trusted Publishing policy for BOTH the FormCraft and
  #     FormCraft.ForMudBlazor packages, naming this repository and THIS workflow file
  #     (release-please.yml — it named continuous.yml until this change), plus the NUGET_USER
  #     secret holding the nuget.org profile name.
  nupkg:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the .nupkg files as release assets
      id-token: write # request the GitHub OIDC token for NuGet Trusted Publishing
    # Job-level so the login step's own `if` can read it — a STEP-level env is NOT visible to that
    # same step's `if` conditional.
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      # `ref` and `fetch-depth: 0` are BOTH required: MinVer derives the package version from the
      # git tag, so without the tag checked out and the full history fetched it resolves no tag and
      # both packages would pack as 0.0.0-alpha.0.N. On a workflow_dispatch dry-run tag_name is
      # empty and checkout falls back to the default ref, which is the intent.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Trusted Publishing: exchanges the OIDC token for a NuGet key valid ~1 hour, so no long-lived
      # secret is stored. Nuke reads it from the NUGET_API_KEY environment variable exactly as
      # before, so build/Build.cs is unchanged — it neither knows nor cares that the key expires.
      # Kept adjacent to the run step below so the ~1h key cannot expire before it is used.
      - name: NuGet login (OIDC -> short-lived key)
        id: login
        if: ${{ needs.release-please.outputs.release_created == 'true' && env.NUGET_USER != '' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      # Test, Pack, then PublishIfNeeded -> Publish. On a dry-run NUGET_API_KEY is empty and the
      # tag is absent, so PublishIfNeeded's static gate skips the push.
      # `dotnet nuget push` runs with --skip-duplicate (EnableSkipDuplicate in build/Build.cs), so
      # re-running a release is idempotent.
      - name: 'Run: Continuous'
        run: ./build.cmd Continuous
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Publish: test-results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results

      - name: Attach packages to the GitHub Release
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" ./artifacts/*.nupkg --clobber
