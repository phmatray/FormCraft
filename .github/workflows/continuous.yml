name: continuous

# Build, test and pack on every push and pull request. This workflow does NOT publish anything:
# releasing — version, changelog, tag, GitHub Release and both NuGet packages — is owned end to end
# by .github/workflows/release-please.yml, which runs the publish in the same job that creates the
# tag. It has to be that way: release-please creates the tag with GITHUB_TOKEN, and GitHub does not
# fire `on: push: tags` for events created by that token, so a tag-triggered publish here would
# simply never run again.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: write
  packages: write

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
      # No package-registry key is minted here, deliberately. Continuous triggers PublishIfNeeded,
      # which is OnlyWhenStatic(IsOnVersionTag() && IsServerBuild); no ref this workflow builds is a
      # version tag, so the publish path never activates and the key stays unset. The Trusted
      # Publishing login lives in release-please.yml's `nupkg` job instead.
      - name: 'Run: Continuous'
        run: ./build.cmd Continuous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: test-results'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
      - name: 'Publish: artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts
