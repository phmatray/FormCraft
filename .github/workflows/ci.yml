name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # Runs BEFORE Test so a style slip reports in ~30s instead of behind a full build+test.
      #
      # This is the only thing that reads .editorconfig (#301). Its severities say `warning` and
      # Directory.Build.props sets TreatWarningsAsErrors=true, which together look like enforcement
      # and are not: IDE* analyzers need EnforceCodeStyleInBuild, which is deliberately NOT set —
      # turning it on would make one missing brace break `dotnet build` mid-edit. Delete this step
      # and the rules go back to being decorative, which is how 574 violations accumulated.
      - run: ./build.cmd Format
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - run: ./build.cmd Test
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      # Why upload at all (#225): under the VSTest bridge Microsoft.Testing.Platform 1.x used, a red
      # run printed only a count and a path to a per-assembly `.log` holding every failing test name,
      # Shouldly message and stack trace — a file that died with the runner. That cost was paid for
      # real during #200. Since #371 `dotnet test` runs in the SDK's native MTP mode (global.json's
      # "test" runner), which prints that detail straight into the job log and writes no `.log` at
      # all — measured on a deliberately failing test. So `gh run view <run-id> --log-failed` is now
      # the first place to look; the reports uploaded here are the structured copy of the same result.
      #
      # `if: always()` is the entire point — the failure path is the only one worth preserving, and it
      # is exactly the path a bare step skips.
      #
      # One path, and as of #231 it is a real one. Build.cs used to ask for `test-results/` through
      # DotNetTest's VSTest surface, which `dotnet test` forwarded as VSTestResultsDirectory /
      # VSTestLogger and Microsoft.Testing.Platform ignored outright (warning MTP0001) — so the
      # directory was never created, no trx or html was ever written, and this step leaned on a
      # `**/TestResults/*.log` glob pointing into the projects' bin directories instead. Build.cs now
      # passes MTP's own `--results-directory`, which puts the trx and html reports under
      # `test-results/<project>/` (one directory per test project since #256). The old glob is
      # deliberately gone rather than kept as a fallback: every workflow that tests reaches Nuke's
      # Test target, so it could now only ever match nothing — the declared-but-inert shape #231 was
      # filed about.
      #
      # `if-no-files-found: ignore` covers the one legitimate miss: a run that fails in Compile,
      # before any test executes and therefore before `test-results/` exists.
      #
      # Reading it. Each *.trx carries every failure as outcome="Failed" under its fully-qualified
      # testName, with the Shouldly message and stack trace in its <Output>; the *.html is the same
      # report rendered for a browser.
      #
      #   gh run download <run-id> -n test-results -D /tmp/tr
      #   grep -o 'testName="[^"]*"[^>]*outcome="Failed"' /tmp/tr/*/*.trx
      #
      # `*/*.trx`, not `*.trx`: each test project writes into its own subdirectory, so a flat glob
      # matches nothing and prints nothing — indistinguishable from a suite that passed.
      - name: 'Publish: test-results'
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore
